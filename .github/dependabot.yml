version: 2

updates:
  # The workflow pins every action to a commit SHA, which is safe but frozen.
  # This is what unfreezes it: Dependabot opens a pull request when an action
  # publishes a new release, updating the SHA and the version comment together,
  # and the CI in that pull request has to pass before it can be merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Routine bumps arrive as ONE pull request rather than one per action:
      # four separate PRs a week for patch releases is noise, and noise gets
      # rubber-stamped.
      actions-minor:
        patterns: ['*']
        update-types: [minor, patch]
      # Majors stay separate and are reviewed one at a time. A major version of
      # a GitHub action usually means a new runner or Node runtime underneath
      # it, which is exactly the change worth reading before merging -- and
      # worth being able to revert on its own.
      actions-major:
        patterns: ['*']
        update-types: [major]
